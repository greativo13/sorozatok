<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nézőnapló</title>
<meta name="description" content="Sorozat- és filmfigyelő: hol tartasz, mit akartál nézni, mikor jön új évad vagy premier.">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black": a tartalom az óra/akku sáv alatt kezdődik, így az iOS nem mossa el a fejlécet -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nézőnapló">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0f0f14; --surface:#1a1a22; --surface2:#24242e; --line:#2e2e3a;
  --text:#f2f2f7; --muted:#9a9aa8; --accent:#ff4f8b; --accent2:#7c5cff;
  --ok:#34c759; --warn:#ffb020; --chip:#2b2b36;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f2f7; --surface:#fff; --surface2:#f0f0f5; --line:#e2e2ea;
    --text:#111118; --muted:#6b6b78; --chip:#ececf2; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block}

/* egyszínű háttér: a backdrop-filter iPhone-on elmosta a fejlécet és eltüntette a gombokat */
header{position:sticky;top:0;z-index:5;background:var(--bg);
  /* ha mégis az állapotsor mögé kerül a tartalom (régi telepítés), az iOS 26 elmosó sávja alá húzzuk a fejlécet */
  padding:calc(var(--safe-t) * 1.5 + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:28px;font-weight:800;margin:0;flex:1;letter-spacing:-.02em}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.icon-btn.primary{background:var(--accent);color:#fff}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:4px 16px calc(var(--safe-b) + 90px);max-width:640px;margin:0 auto}
.banner{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:16px;
  padding:12px 14px;margin:6px 0 14px;font-weight:600;font-size:15px}
.banner div+div{margin-top:4px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 4px 8px;font-weight:700}

.card{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:10px;align-items:center}
.poster{width:56px;height:80px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none;
  display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--muted)}
.card .body{flex:1;min-width:0}
.card .name{font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card>.btn{padding:8px 10px;font-size:13px;flex:none}
/* színes helyettesítő borító, ha nincs kép */
.ph{color:#fff!important;font-size:18px!important;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
/* állapotcímkék */
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px;text-transform:uppercase}
.t-new{background:var(--accent);color:#fff}.t-soon{background:var(--accent2);color:#fff}.t-ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.t-gray{background:var(--chip);color:var(--muted)}
/* haladássáv */
.prog{height:5px;border-radius:3px;background:var(--surface2);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog-l{font-size:11px;color:var(--muted);margin-top:3px}
/* "Ma jön" sáv */
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip-it{flex:none;width:112px;scroll-snap-align:start}
.strip-it .poster{width:112px;height:160px;border-radius:12px;font-size:26px}
.strip-it .when{font-size:12px;font-weight:800;color:var(--accent);margin-top:6px;text-transform:uppercase}
.strip-it .nm{font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip-it .lb{font-size:12px;color:var(--muted)}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.card .sub.hl{color:var(--accent);font-weight:600}
.card .sub.ok{color:var(--ok)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;
  background:var(--accent);color:#fff;vertical-align:2px;margin-left:6px}
.badge.soon{background:var(--accent2)}
.badge.gray{background:var(--chip);color:var(--muted)}
.btn{background:var(--surface2);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.block{display:block;width:100%;padding:13px;font-size:16px;text-align:center;margin-top:10px}
.btn.danger{color:#ff453a}
.btn:disabled{opacity:.4}

.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

.day-row{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:8px}
.date-chip{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--surface2);padding:6px 0}
.date-chip .m{font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:800}
.date-chip .d{font-size:20px;font-weight:800;line-height:1.1}
.date-chip .w{font-size:11px;color:var(--muted)}
.day-row.premiere{box-shadow:inset 0 0 0 2px var(--accent)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:space-around;
  background:var(--surface);
  border-top:1px solid var(--line);padding:6px 0 calc(var(--safe-b) + 6px)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .dot{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--accent);color:#fff;font-size:10px;
  min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center;
  padding-top:calc(var(--safe-t) + 16px)}
.sheet-bg.open{display:flex}
/* a lap ne érjen fel az iPhone állapotsorába (ott az iOS elmossa a tartalmat) */
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:100%;
  overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--safe-b) + 20px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
/* a fejléc (Kész gomb) görgetéskor is látszik */
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:sticky;top:0;z-index:2;
  background:var(--bg);padding:10px 0}
.sheet-head h2{flex:1;margin:0;font-size:20px}
.field{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
input[type=search],input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.result{display:flex;gap:12px;align-items:center;padding:10px;background:var(--surface);border-radius:14px;margin-bottom:8px}
.result .acts{display:flex;flex-direction:column;gap:6px}
.detail-top{display:flex;gap:14px;margin-bottom:14px}
.detail-top img,.detail-top .poster{width:90px;height:130px;border-radius:12px;object-fit:cover}
.muted{color:var(--muted)}
.small{font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.list-plain .card{padding:8px 10px}
.list-plain .poster{width:40px;height:56px;font-size:16px}
.yt-row{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:8px;margin-bottom:8px;color:inherit;text-decoration:none;position:relative}
.yt-row img,.yt-row .yt-ph{width:120px;height:68px;border-radius:8px;object-fit:cover;background:var(--surface2);flex:none}
.yt-x{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:14px;font-weight:700;align-self:center}
.yt-row.new{box-shadow:inset 3px 0 0 var(--accent)}
.yt-body{flex:1;min-width:0}
.yt-title{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.yt-ch{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:6px 8px;margin-bottom:6px}
.yt-ch img,.yt-ch .yt-ph{width:32px;height:32px;border-radius:50%;flex:none;background:var(--surface2)}
.disc-poster{width:46px;height:66px;font-size:18px}
.wk{display:flex;gap:4px}
.wk button{flex:1;padding:8px 0;border-radius:8px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted)}
.wk button.on{background:var(--accent);color:#fff}
.chk{display:flex!important;gap:8px;align-items:center;margin-top:10px;font-size:14px!important;color:var(--text)!important;font-weight:500!important}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;color:var(--line)}
.stars button.on{color:var(--warn)}
.stat-row{display:flex;text-align:center}
.stat-row>div{flex:1}
.stat-row b{display:block;font-size:26px}
.stat-row span{font-size:12px;color:var(--muted)}
.provs{display:flex;flex-wrap:wrap;gap:6px}
.prov{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.prov img{width:26px;height:26px;border-radius:6px}
.ask{display:flex;gap:12px;align-items:flex-start;box-shadow:inset 0 0 0 2px var(--accent2)}
.ask .poster{width:46px;height:66px;font-size:18px}
details.more{margin-top:4px}
details.more>summary{list-style:none;cursor:pointer;background:var(--surface);border-radius:14px;padding:13px 12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'›';margin-left:auto;font-size:22px;line-height:1;color:var(--muted);transition:transform .2s}
details.more[open]>summary::after{transform:rotate(90deg)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media (min-width:520px){.dgrid{grid-template-columns:repeat(3,1fr)}}
.dtile{min-width:0;cursor:pointer}
.dimg{position:relative}
.dimg .poster{width:100%;height:auto;aspect-ratio:2/3;border-radius:12px;font-size:30px!important}
.dbadge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;text-transform:uppercase}
.dhave{position:absolute;right:6px;top:6px;background:var(--ok);color:#fff;font-size:12px;font-weight:800;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.dhave.me{background:rgba(0,0,0,.72)}
.dname{font-weight:700;font-size:14px;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-card{cursor:pointer}
.stat-row.big b{font-size:34px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:22px;min-height:2px;background:var(--accent);border-radius:4px 4px 0 0}
.bar .bv{font-size:10px;font-weight:700;margin-bottom:2px;color:var(--text)}
.bar .bl{font-size:9px;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);width:100%;text-align:center;padding-top:3px}
details.grp .field:first-child{margin-top:0}
[data-swipe-l],[data-swipe-r]{touch-action:pan-y;position:relative}
main{overflow-x:clip}
.sw-l::after,.sw-r::after{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:15px;white-space:nowrap;color:var(--muted)}
.sw-l::after{content:attr(data-sl);left:100%;margin-left:16px}
.sw-r::after{content:attr(data-sr);right:100%;margin-right:16px}
.sw-go::after{color:var(--accent)}
.sw-go.sw-r::after{color:var(--ok)}
#dSeg button{font-size:13px;padding:8px 2px}
.cover-btn{position:relative;flex:none}
.cover-btn .cam{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.cover-btn .cam svg{width:16px;height:16px}
</style>
</head>
<body>
<header>
  <h1 id="title">Nézem</h1>
  <button class="icon-btn" id="refreshBtn" aria-label="Frissítés"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="icon-btn primary" id="addBtn" aria-label="Sorozat hozzáadása"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</header>
<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-tab="nezem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Nézem</button>
  <button data-tab="tervezem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Tervezem</button>
  <button data-tab="kozelgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Közelgő</button>
  <button data-tab="youtube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg>YouTube</button>
  <button data-tab="beall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Beállítások</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="coverFile" accept="image/*" hidden>

<script>
'use strict';
const APP_VER = '22';
const KEY = 'sorozatmemoria.v1';
const API = 'https://api.tvmaze.com';
const DAY = 864e5;
const STALE = 12 * 3600e3;
const TITLES = {nezem:'Nézem', tervezem:'Tervezem', kozelgo:'Közelgő', youtube:'YouTube', beall:'Beállítások'};
const GENRE_HU = {Action:'Akció', Adult:'Felnőtt', Adventure:'Kaland', Anime:'Anime', Animation:'Animáció', Documentary:'Dokumentum', Children:'Gyerek', Comedy:'Vígjáték',
  Crime:'Krimi', DIY:'Barkács', Drama:'Dráma', Espionage:'Kém', Family:'Családi', Fantasy:'Fantasy', Food:'Gasztro', History:'Történelmi',
  Horror:'Horror', Legal:'Jogi', Medical:'Orvosi', Music:'Zenei', Mystery:'Rejtély', Nature:'Természet', Romance:'Romantikus',
  'Science-Fiction':'Sci-fi', Sports:'Sport', Supernatural:'Természetfeletti', Thriller:'Thriller', Travel:'Utazás', War:'Háborús', Western:'Western'};
const genresHu = g => (g || []).map(x => GENRE_HU[x] || x);
const STATUS_HU = {'Running':'Fut','Ended':'Véget ért','To Be Determined':'Bizonytalan','In Development':'Készül'};

let state = load();
let tab = lsGet('sorozatmemoria.tab') || 'nezem';
let refreshing = false;
let sheetState = null; // {type:'search'|'detail'|'manual', id?}
let searchKind = lsGet('sorozatmemoria.kind') || 'sorozat';
let tervFilter = 'mind';
let kozView = lsGet('nezonaplo.kozView') || 'sajat', discKind = lsGet('nezonaplo.discKind') || 'uj';

/* ---------- tárolás ---------- */
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.shows)) return s; } catch(e){}
  return {shows:[], lastRefresh:0};
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Nem sikerült menteni: ' + e.message); }
}
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- segédek ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const now = () => Date.now();
const pad = n => String(n).padStart(2,'0');
const code = (s,n) => `S${s}E${pad(n)}`;
const byId = id => state.shows.find(x => x.id === id);
function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function dayDiff(t){ return Math.round((startOfDay(t) - startOfDay(now())) / DAY); }
function fmtDate(t, opts){
  const d = new Date(t);
  const o = Object.assign({month:'short', day:'numeric'}, opts || {});
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return new Intl.DateTimeFormat('hu-HU', o).format(d);
}
function rel(t){
  const n = dayDiff(t);
  if (n === 0) return 'ma'; if (n === 1) return 'holnap'; if (n === -1) return 'tegnap';
  if (n > 1 && n < 7) return `${n} nap múlva`;
  return fmtDate(t);
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400);
}
function posterHtml(sh, cls){
  if (sh.image) return `<img class="${cls||'poster'}" src="${esc(sh.image)}" alt="" loading="lazy">`;
  // nincs kép: a címből számolt színátmenet + kezdőbetűk
  const n = String(sh.name || '?'); let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ini = n.replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

/* ---------- epizód logika ---------- */
const eps = sh => (sh.cache && sh.cache.episodes) || [];
const after = (e, s, n) => e.s > s || (e.s === s && e.n > n);
function nextUnwatched(sh){ return eps(sh).find(e => after(e, sh.lastSeason, sh.lastEpisode)); }
// Meddig érhetők el a részek: most, vagy ha a műsor streamingen (pl. RTL+) előrébb jár,
// akkor a következő 'ahead' darab tévés rész is már nézhetőnek számít.
function availUntil(sh){
  const t = now(); if (!sh.ahead) return t;
  // csak a 14 napon belül adásba kerülő részek (évadszünet után ne számítson elérhetőnek a következő évad)
  const fut = eps(sh).filter(e => e.d && e.d > t && e.d - t < 14 * DAY).sort((a, b) => a.d - b.d);
  return fut.length ? Math.max(t, fut[Math.min(sh.ahead, fut.length) - 1].d) : t;
}
function unwatchedAired(sh){ const t = availUntil(sh); return eps(sh).filter(e => after(e, sh.lastSeason, sh.lastEpisode) && e.d && e.d <= t); }
function futureEps(sh){ const t = availUntil(sh); return eps(sh).filter(e => e.d && e.d > t).sort((a,b) => a.d - b.d); }
function manualFuture(sh){
  if (!sh.manualNext || !sh.manualNext.date) return null;
  const t = Date.parse(sh.manualNext.date + 'T12:00:00');
  return dayDiff(t) >= 0 ? t : null;
}
// Saját heti adásrend (pl. szombat 20:00), ha a TVmaze-dátum hiányzik vagy hibás
const WD_HU = [['H',1],['K',2],['Sze',3],['Cs',4],['P',5],['Szo',6],['V',0]];

function schedNext(sh){
  const [hh, mm] = (sh.sched.time || '20:00').split(':').map(Number), t = now();
  for (let i = 0; i < 8; i++) {
    const d = new Date(); d.setDate(d.getDate() + i); d.setHours(hh || 0, mm || 0, 0, 0);
    if (sh.sched.days.includes(d.getDay()) && d.getTime() > t) return d.getTime();
  }
  return null;
}
function schedLabel(sh){
  const t = now(), aired = eps(sh).filter(e => e.d && e.d <= t);
  const last = aired[aired.length - 1];
  return last ? code(last.s, last.n + 1) + ' · várható' : 'Következő rész · várható';
}
function nextInfo(sh){
  // legkorábbi közelgő esemény (API vagy kézi)
  if (isFilm(sh)) {
    const fd = filmDate(sh), m = manualFuture(sh);
    const api = fd && fd.prec === 11 && dayDiff(fd.d) >= 0 ? fd : null;
    if (api && (!m || api.d <= m)) return {d: api.d, label: fd.hu ? 'Magyar premier' : 'Premier', film: true};
    if (m) return {d: m, label: sh.manualNext.label || 'Kézi emlékeztető', manual: true, film: true};
    return null;
  }
  let f = futureEps(sh)[0];
  const m = manualFuture(sh);
  if (schedOn(sh) && (sh.sched.force || !f)) { const sd = schedNext(sh); if (sd) f = {d: sd, sched: true}; }
  if (f && f.sched && (!m || f.d <= m)) return {d:f.d, label:schedLabel(sh), sched:true};
  if (f && (!m || f.d <= m)) return {d:f.d, label:code(f.s,f.n), premiere:f.n === 1, ep:f};
  if (m) return {d:m, label:sh.manualNext.label || 'Kézi emlékeztető', premiere:/évad|season/i.test(sh.manualNext.label||''), manual:true};
  return null;
}
// hány részt lépett előre (visszalépésnél negatív) – a statisztikához
function epDelta(sh, s1, n1, s2, n2){
  const list = eps(sh);
  if (list.length) {
    const fwd = list.filter(e => after(e, s1, n1) && !after(e, s2, n2)).length;
    return fwd || -list.filter(e => after(e, s2, n2) && !after(e, s1, n1)).length;
  }
  if (s2 === s1) return n2 - n1;
  return s2 > s1 ? n2 : 0;
}

  sh.lastSeason = s; sh.lastEpisode = n;
  if (!k) return;
  const y = new Date().getFullYear();
  state.stats = state.stats || {}; if (!state.statsSince) state.statsSince = now();
  const st = state.stats[y] = state.stats[y] || {eps: 0, shows: {}};
  st.eps = Math.max(0, st.eps + k); st.shows[sh.id] = Math.max(0, (st.shows[sh.id] || 0) + k);
  const mo = new Date().getMonth(); st.months = st.months || {}; st.months[mo] = Math.max(0, (st.months[mo] || 0) + k);
}

const WD = 'https://www.wikidata.org/w/api.php';
// film, animációs film, nagyjátékfilm, tévéfilm, filmterv (még be nem mutatott)
const FILM_TYPES = 'haswbstatement:P31=Q11424|P31=Q202866|P31=Q24869|P31=Q506240|P31=Q18011172';

    const v = p.mainsnak && p.mainsnak.datavalue && p.mainsnak.datavalue.value; if (!v) return null;
    const m = /^([+-]\d+)-(\d\d)-(\d\d)/.exec(v.time); if (!m) return null;
    const y = +m[1], mo = +m[2], da = +m[3];
    const prec = v.precision >= 11 && da ? 11 : (v.precision >= 10 && mo ? 10 : 9);
    const hu = ((p.qualifiers && p.qualifiers.P291) || []).some(q => q.datavalue && q.datavalue.value.id === 'Q28');
    return {d: new Date(y, Math.max(1, mo) - 1, Math.max(1, da), 12).getTime(), prec, hu};

  return {
    name: lbl('hu') || lbl('en') || x.id,
    image: file ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=200` : null,
    meta: {
      orig: lbl('en'),
      desc: (x.descriptions && (x.descriptions.hu || x.descriptions.en) || {}).value || '',
      release: first ? first.d : null, prec: first ? first.prec : null,
      huRelease: hu ? hu.d : null,
      tmdbId: ((((c.P4947 || [])[0] || {}).mainsnak || {}).datavalue || {}).value || null,
      next: ((((((c.P156 || [])[0] || {}).mainsnak || {}).datavalue || {}).value) || {}).id || null,
      imdb: ((((c.P345 || [])[0] || {}).mainsnak || {}).datavalue || {}).value || null

}

      if (e.status === 404) { yt.pl = null; toast('A YouTube lista már nem létezik – válassz újat'); }
      else toast('A YouTube lista szinkronizálása most nem sikerült');
    }
    const channels = []; let page = '';
    do {
      const j = await ytApi('subscriptions', Object.assign({part: 'snippet', mine: 'true', maxResults: '50', order: 'alphabetical'}, page ? {pageToken: page} : {}));
      for (const it of j.items || []) channels.push({id: it.snippet.resourceId.channelId, title: it.snippet.title,
        thumb: ((it.snippet.thumbnails || {}).default || {}).url || null});
      page = j.nextPageToken || '';
    } while (page);
    const limit = now() - 30 * DAY, videos = [];
    const todo = channels.filter(c => !yt.hidden[c.id]);
    const worker = async () => {
      for (let c; (c = todo.shift()); ) {
        try {
          const j = await ytApi('playlistItems', {part: 'snippet', playlistId: 'UU' + c.id.slice(2), maxResults: '6'});
          for (const it of j.items || []) {
            const s = it.snippet, pub = Date.parse(s.publishedAt);
            if (!s.resourceId || pub < limit || /^(Private|Deleted) video$/.test(s.title)) continue;
            videos.push({id: s.resourceId.videoId, ch: c.id, title: s.title, pub,
              thumb: ((s.thumbnails || {}).medium || (s.thumbnails || {}).default || {}).url || null});
          }
        } catch(e) { if (e.message === 'auth') throw e; } // pl. üres csatorna: kihagyjuk
      }
    };
    await Promise.all(Array.from({length: 6}, worker));
    // videók hossza (Shorts-szűréshez és kiíráshoz); amit már tudunk, nem kérjük le újra

        for (const it of j.items || []) durs[it.id] = isoSec((it.contentDetails || {}).duration);
      } catch(e) { if (e.message === 'auth') throw e; }
    }
    yt.durs = {}; for (const v of videos) if (v.id in durs) yt.durs[v.id] = durs[v.id];
    const first = !yt.fetchedAt;
    yt.channels = channels;
    yt.videos = videos.sort((a, b) => b.pub - a.pub);
    const ids = new Set(videos.map(v => v.id)), seen = {};
    for (const v of videos) if (yt.seen[v.id] || (first && v.pub < now() - 3 * DAY)) seen[v.id] = 1;

    const nope = {}; for (const id in yt.nope) if (ids.has(id)) nope[id] = 1;
    yt.seen = seen; yt.nope = nope; yt.fetchedAt = now(); ytSave();

    if (e.message === 'auth') { if (byUser) ytLogin(true); }
    else toast(e.status === 403 ? 'A YouTube nem engedte (403) – nézd meg a Google beállítást' : 'Nem sikerült frissíteni a YouTube-ot');
  }

}
const isoSec = iso => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || ''); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; };
const secTxt = n => n >= 3600 ? `${Math.floor(n / 3600)}:${pad(Math.floor(n / 60) % 60)}:${pad(n % 60)}` : `${Math.floor(n / 60)}:${pad(n % 60)}`;
// Shorts: legfeljebb 3 perces videók (a YouTube nem jelzi külön, a hossz alapján szűrünk)
const isShort = v => { const d = (yt.durs || {})[v.id]; return d > 0 && d <= 180; };
const ytVisible = () => yt.videos.filter(v => !yt.hidden[v.ch] && !yt.nope[v.id] && !(yt.shortsHide !== false && isShort(v)));
const ytNewCount = () => ytVisible().filter(v => !yt.seen[v.id]).length;
function ytAgo(t){

  if (m < 60) return `${Math.max(1, m)} perce`; if (m < 24 * 60) return `${Math.round(m / 60)} órája`;
  return rel(t);
}
function ytFind(id){ return yt.videos.find(v => v.id === id) || (yt.later || {})[id] || null; }
function ytDur(iso){

  const h = +m[1] || 0, mi = +m[2] || 0, se = +m[3] || 0;
  return h ? `${h}:${pad(mi)}:${pad(se)}` : `${mi}:${pad(se)}`;
}

function bannerHtml(){
  const active = state.shows.filter(sh => sh.status !== 'abbahagytam' && sh.status !== 'befejeztem');
  const lines = [];
  const withNew = active.filter(sh => sh.status === 'nezem' && unwatchedAired(sh).length);
  if (withNew.length) {
    const total = withNew.reduce((a, sh) => a + unwatchedAired(sh).length, 0);
    lines.push(`🎬 ${total} meg nem nézett rész vár ${withNew.length} sorozatban`);
  }
  const fresh = active.filter(recentPremiere);
  if (fresh.length) lines.push(`🔥 Új évad jött ki: ${fresh.map(sh => esc(sh.name)).join(', ')}`);
  const soon = active.map(sh => ({sh, x: nextInfo(sh)})).filter(o => o.x && o.x.premiere && dayDiff(o.x.d) <= 7);
  if (soon.length) lines.push(`📅 Hamarosan új évad: ${soon.map(o => `${esc(o.sh.name)} (${rel(o.x.d)})`).join(', ')}`);
  const films = state.shows.filter(sh => isFilm(sh) && sh.status === 'tervezem').map(sh => ({sh, x: nextInfo(sh)})).filter(o => o.x && dayDiff(o.x.d) <= 7);
  if (films.length) lines.push(`🎞️ Hamarosan film: ${films.map(o => `${esc(o.sh.name)} (${rel(o.x.d)})`).join(', ')}`);

/* ---------- "Jön új évad / folytatás – érdekel?" ---------- */
// sorozat: a "Befejeztem" állapotú sorozatoknál figyeljük az új évadot
function newSeasonOf(sh){
  if (isFilm(sh) || sh.status !== 'befejeztem') return null;
  const nxt = eps(sh).filter(e => e.s > (sh.lastSeason || 0)).sort((a, b) => a.s - b.s || a.n - b.n)[0];
  if (!nxt || (sh.asked || {})['s:' + nxt.s]) return null;
  return nxt;
}
// film: a megnézett film folytatása (Wikidata), ha még nem jött ki vagy nemrég jött ki
function sequelOf(sh){
  if (!isFilm(sh) || sh.status !== 'lattam' || !sh.seq || (sh.asked || {})['f:' + sh.seq.qid]) return null;
  if (state.shows.some(x => x.qid === sh.seq.qid)) return null;
  const fd = filmDate(sh.seq);
  if (fd && fd.d < now() - 90 * DAY) return null;
  return sh.seq;
}
function promptsHtml(){
  const out = [];
  for (const sh of state.shows) {
    const ns = newSeasonOf(sh);
    if (ns) out.push(`<div class="field ask">${posterHtml(sh)}<div style="flex:1;min-width:0"><div class="small" style="line-height:1.35">🔔 Jön a <b>${esc(sh.name)}</b> ${ns.s}. évadja${ns.d ? ' (' + (ns.d > now() ? rel(ns.d) : 'már elindult') + ')' : ''}. Érdekel?</div>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-act="askYes" data-id="${sh.id}" data-k="s:${ns.s}">Érdekel</button><button class="btn" data-act="askNo" data-id="${sh.id}" data-k="s:${ns.s}">Nem érdekel</button></div></div></div>`);
    const sq = sequelOf(sh);
    if (sq) { const fd = filmDate(sq);
      out.push(`<div class="field ask">${posterHtml(sq)}<div style="flex:1;min-width:0"><div class="small" style="line-height:1.35">🔔 Folytatás jön: <b>${esc(sq.name)}</b>${fd ? ' (' + (fd.d > now() ? (fd.prec === 11 ? rel(fd.d) : fmtFilmDate(fd)) : 'már bemutatták') + ')' : ''}, a(z) ${esc(sh.name)} folytatása. Érdekel?</div>
        <div class="row" style="margin-top:8px"><button class="btn primary" data-act="askYes" data-id="${sh.id}" data-k="f:${sq.qid}">Érdekel</button><button class="btn" data-act="askNo" data-id="${sh.id}" data-k="f:${sq.qid}">Nem érdekel</button></div></div></div>`); }
  }
  return out.join('');
}
function askAnswer(sh, k, yes){
  sh.asked = sh.asked || {}; sh.asked[k] = yes ? 'yes' : 'no';
  if (yes && k.startsWith('s:')) { sh.status = 'nezem'; toast(`${sh.name} → Nézem`); }
  if (yes && k.startsWith('f:') && sh.seq) {
    const q = sh.seq;
    state.shows.push({id:uid(), kind:'film', qid:q.qid, tvmazeId:null, name:q.name, image:q.image, meta:q.meta,
      status:'tervezem', lastSeason:0, lastEpisode:0, notes:`${sh.name} folytatása`, manualNext:null, added:now(), seenAt:null, cache:{fetchedAt:0}});
    toast(`${q.name} → Tervezem`);
  }
  if (!yes) toast('Rendben, erről nem szólok többet');
  save(); render();
}
// megnézett filmek folytatásának keresése (hetente egyszer filmenként)
async function sequelCheck(only){
  if (sequelCheck.busy) return; sequelCheck.busy = true;
  const list = only ? [only] : state.shows.filter(sh => isFilm(sh) && sh.qid && sh.status === 'lattam' && now() - (sh.seqAt || 0) > 7 * DAY);
  for (const sh of list) {
    try {
      const e = (await wdEntities([sh.qid]))[sh.qid];
      if (e && e.missing === undefined) { const f = parseFilm(e); sh.meta = Object.assign({}, sh.meta, {next: f.meta.next}); }
      const nq = sh.meta && sh.meta.next;
      if (nq) {
        const x = (await wdEntities([nq]))[nq];
        if (x && x.missing === undefined) { const f = parseFilm(x); sh.seq = {qid: nq, name: f.name, image: f.image, meta: f.meta}; }
      }
      sh.seqAt = now(); save();
    } catch(err) {}
    await sleep(400);
  }
  sequelCheck.busy = false;
  if (tab === 'nezem') render();
}

// az aktuális évad haladása (az évad, amelyikben a következő megnézendő rész van)
function seasonProgress(sh){
  const all = eps(sh); if (!all.length) return null;
  const nu = nextUnwatched(sh), s = nu ? nu.s : sh.lastSeason; if (!s) return null;
  const inS = all.filter(e => e.s === s); if (inS.length < 2) return null;
  return {s, total: inS.length, done: inS.filter(e => !after(e, sh.lastSeason, sh.lastEpisode)).length};
}

function cardNezem(sh){
  const ua = unwatchedAired(sh);
  const nu = nextUnwatched(sh);
  const nx = nextInfo(sh);
  let l1 = sh.lastSeason ? `${code(sh.lastSeason, sh.lastEpisode)}-nél tartasz` : 'Még nem kezdted el';
  let l2, cls = '';
  if (ua.length) l2 = `<span class="tag t-new">${ua.length === 1 ? '1 új rész' : ua.length + ' új rész'}</span>`;
  else if (nx && dayDiff(nx.d) <= 1) l2 = `<span class="tag t-soon">${rel(nx.d)}</span>${esc(nx.label)}`;
  else if (nx) l2 = `<span class="tag t-ok">Naprakész</span>köv.: ${rel(nx.d)} · ${esc(nx.label)}`;
  else if (isEnded(sh)) l2 = '<span class="tag t-gray">Véget ért</span>';
  else l2 = '<span class="tag t-ok">Naprakész</span>nincs még dátum';
  if (!sh.tvmazeId && !nx) l2 = '<span class="tag t-gray">Kézi</span>';
  const pr = seasonProgress(sh);

  if (recentPremiere(sh)) badge = '<span class="badge">ÚJ ÉVAD</span>';
  else if (nx && nx.premiere && dayDiff(nx.d) <= 14) badge = `<span class="badge soon">${rel(nx.d).toUpperCase()}</span>`;
  let btn = '';
  if (sh.tvmazeId) { if (nu && nu.d && nu.d <= availUntil(sh)) btn = `<button class="btn primary" data-act="plus" data-id="${sh.id}">✓ ${code(nu.s, nu.n)}</button>`; }
  else btn = `<button class="btn primary" data-act="plus" data-id="${sh.id}">+1 rész</button>`;
  if (sh.tvmazeId && !ua.length && !nx && sh.lastSeason) btn = `<button class="btn" data-act="finish" data-id="${sh.id}">Befejeztem</button>`;
  const sw = btn.includes('data-act="plus"') ? `data-swipe-l="plus" data-sl="+1 rész"` : '';
  return `<div class="card" data-act="open" data-id="${sh.id}" ${sw}>${posterHtml(sh)}

}

function upcomingItems(){
  const items = [], noDate = [];
  const t = now();
  for (const sh of state.shows) {
    if (sh.status === 'abbahagytam' || sh.status === 'befejeztem') continue;
    if (isFilm(sh)) {
      if (sh.status !== 'tervezem') continue;
      const fd = filmDate(sh), m = manualFuture(sh);
      if (fd && fd.prec === 11 && dayDiff(fd.d) >= 0) items.push({sh, d: fd.d, label: fd.hu ? 'Magyar mozipremier' : 'Premier', film: true, key: sh.id + 'f'});
      if (m) items.push({sh, d: m, label: sh.manualNext.label || 'Kézi emlékeztető', film: true, key: sh.id + 'm'});
      if (!m && fd && fd.prec < 11 && fd.d > startOfDay(now()) - 365*DAY && new Date(fd.d).getFullYear() >= new Date().getFullYear()) noDate.push(sh);
      continue;
    }
    let fut = futureEps(sh);
    if (schedOn(sh) && (sh.sched.force || !fut.length)) {
      const sd = schedNext(sh); fut = [];
      if (sd) items.push({sh, d: sd, label: schedLabel(sh) + ' · saját adásrend', key: sh.id + 'w'});
    }
    const seen = new Set();
    fut.forEach((e, i) => {
      if (i === 0 || e.n === 1 || e.d - t < 14*DAY) {
        const k = e.s + '-' + e.n; if (seen.has(k)) return; seen.add(k);
        items.push({sh, d:e.d, label:code(e.s, e.n) + (e.t && !/^Episode \d+$/i.test(e.t) ? ' · ' + e.t : ''), premiere:e.n === 1, key:sh.id + k});
      }
    });
    const m = manualFuture(sh);
    if (m) items.push({sh, d:m, label:sh.manualNext.label || 'Kézi emlékeztető', premiere:/évad|season/i.test(sh.manualNext.label||''), key:sh.id + 'm'});
    if (!fut.length && !m && !schedOn(sh) && !isEnded(sh) && sh.tvmazeId) noDate.push(sh);
  }
  items.sort((a, b) => a.d - b.d);
  return {items, noDate};
}

  return html;

function statsData(y){
  const st = (state.stats || {})[y] || {eps: 0, shows: {}, months: {}};
  const films = state.shows.filter(sh => isFilm(sh) && sh.status === 'lattam' && sh.seenAt && new Date(sh.seenAt).getFullYear() === y);
  const top = Object.entries(st.shows || {}).map(([id, n]) => [byId(id), n]).filter(([sh, n]) => sh && n > 0).sort((a, b) => b[1] - a[1]);
  const rated = state.shows.filter(sh => sh.rating);
  const best = rated.slice().sort((a, b) => b.rating - a.rating || (b.seenAt || 0) - (a.seenAt || 0));
  const avg = rated.length ? (rated.reduce((a, sh) => a + sh.rating, 0) / rated.length).toFixed(1).replace('.', ',') : '';
  return {st, films, top, best, avg};
}

function openSheet(st){ sheetState = st; moreOpen = false; $('#sheetBg').classList.add('open');
  if (st.type === 'detail') { const sh = byId(st.id); if (sh) tmdbLoad(sh).then(ch => { if (ch && sheetState && sheetState.id === st.id) renderDetail(); }); }
  if (st.type === 'search') renderSearch(); else if (st.type === 'detail') renderDetail(); else if (st.type === 'manual') renderManual(); else if (st.type === 'yt') renderYtDetail(); else if (st.type === 'disc') renderDiscDetail(); else if (st.type === 'stats') renderStats(); }
function closeSheet(){ sheetState = null; $('#sheetBg').classList.remove('open'); $('#sheet').innerHTML = ''; }

function renderSearch(){
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="sheet-head"><h2>Hozzáadás</h2><button class="btn" data-act="close">Kész</button></div>
    <div class="seg" id="kSeg" style="margin-bottom:10px"><button data-v="sorozat" class="${searchKind === 'sorozat' ? 'on' : ''}">Sorozat</button><button data-v="film" class="${searchKind === 'film' ? 'on' : ''}">Film</button></div>
    <input type="search" id="q" placeholder="${searchKind === 'film' ? 'Film címe (pl. Dűne)' : 'Sorozat címe (pl. Severance)'}" autocomplete="off" autocorrect="off" enterkeyhint="search">
    <div id="results" style="margin-top:12px"></div>
    <button class="btn block" data-act="manual">Nem találom – kézi hozzáadás</button>`;
  const q = $('#q');
  $('#kSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    searchKind = b.dataset.v; lsSet('sorozatmemoria.kind', searchKind);
    $('#kSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    q.placeholder = searchKind === 'film' ? 'Film címe (pl. Dűne)' : 'Sorozat címe (pl. Severance)';
    doSearch(q.value); q.focus();
  });
  q.addEventListener('input', () => { clearTimeout(renderSearch.t); renderSearch.t = setTimeout(() => doSearch(q.value), 350); });
  setTimeout(() => q.focus(), 50);
  doSearch('');
}
async function doSearch(text){
  const box = $('#results'); if (!box) return;
  text = text.trim();
  const stale = () => !$('#results') || $('#q').value.trim() !== text || searchKind !== 'sorozat';
  if (searchKind === 'sorozat' && text.length < 2) {
    // üres keresőnél: most futó magyar műsorok
    const hu = (await huShows()).filter(s => s.status === 'Running').sort((a, b) => a.name.localeCompare(b.name, 'hu'));
    if (stale()) return;
    doSearch.cache = hu.map(huAsShow);
    box.innerHTML = hu.length ? `<div class="muted small" style="padding:4px 2px 8px">Most futó magyar műsorok</div>` + doSearch.cache.map(showRow).join('') : '';
    return;
  }
  if (text.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="muted small" style="padding:8px">Keresés…</div>';
  if (searchKind === 'film') return searchFilms(text);
  const local = huMatch(await huShows(), text).slice(0, 8).map(huAsShow);
  let remote = null;
  try {
    const r = await fetch(`${API}/search/shows?q=${encodeURIComponent(text)}`);
    remote = (await r.json()).map(x => x.show);
  } catch(e) {}
  if (stale()) return;
  // magyar találatok előre, utánuk a többi (ismétlés nélkül)
  const isHu = s => ((s.network || s.webChannel || {}).country || {}).code === 'HU';
  const rest = (remote || []).filter(s => !local.some(l => l.id === s.id));
  const list = [...local, ...rest.filter(isHu), ...rest.filter(s => !isHu(s))];
  doSearch.cache = list;
  if (!list.length) {
    box.innerHTML = remote ? '<div class="muted small" style="padding:8px">Nincs találat.</div>'
      : '<div class="muted small" style="padding:8px">Nem sikerült keresni (nincs internet?). Használd a kézi hozzáadást.</div>';
    return;
  }
  box.innerHTML = list.slice(0, 14).map(showRow).join('');
}
function showRow(show){
  const have = state.shows.find(sh => sh.tvmazeId === show.id);
  const s = slimShow(show);
  const year = show.premiered ? show.premiered.slice(0,4) : '';
  const sub = [year, s.meta.network, STATUS_HU[show.status]].filter(Boolean).join(' · ');
  return `<div class="result">${posterHtml({image:s.image, name:show.name})}
    <div class="body" style="flex:1;min-width:0"><div class="name" style="font-weight:700">${esc(show.name)}</div><div class="sub muted small">${esc(sub)}</div></div>
    <div class="acts">${have ? '<span class="small muted">Már a listádon</span>' :
      `<button class="btn primary" data-act="add" data-tid="${show.id}" data-st="nezem">Nézem</button>
       <button class="btn" data-act="add" data-tid="${show.id}" data-st="tervezem">Tervezem</button>`}</div></div>`;
}
async function searchFilms(text){
  const box = $('#results');
  try {
    const s = await (await fetch(`${WD}?action=query&list=search&srsearch=${encodeURIComponent(text.replace(/[:"()\[\]~*?\\!-]/g, ' ') + ' ' + FILM_TYPES)}&srlimit=12&format=json&origin=*`)).json();
    const ids = ((s.query && s.query.search) || []).map(x => x.title);
    if (!$('#results') || $('#q').value.trim() !== text || searchKind !== 'film') return;
    if (!ids.length) { box.innerHTML = '<div class="muted small" style="padding:8px">Nincs találat. Próbáld angol címmel, vagy add hozzá kézzel.</div>'; return; }
    const ents = await wdEntities(ids);
    if (!$('#results') || $('#q').value.trim() !== text || searchKind !== 'film') return;
    const films = ids.map(id => ents[id] && Object.assign({qid: id}, parseFilm(ents[id]))).filter(Boolean);
    searchFilms.cache = films;
    box.innerHTML = films.map(f => {
      const have = state.shows.find(sh => sh.qid === f.qid);
      const fd = filmDate(f);
      const when = fd ? (fd.d > now() ? 'Várható: ' + fmtFilmDate(fd) : new Date(f.meta.release).getFullYear()) : '';
      const sub = [when, f.meta.orig && f.meta.orig !== f.name ? f.meta.orig : '', f.meta.desc].filter(Boolean).join(' · ');
      return `<div class="result">${posterHtml(f)}
        <div class="body" style="flex:1;min-width:0"><div class="name" style="font-weight:700">${esc(f.name)}</div><div class="sub muted small">${esc(sub)}</div></div>
        <div class="acts">${have ? '<span class="small muted">Már a listádon</span>' :
          `<button class="btn primary" data-act="addFilm" data-qid="${f.qid}" data-st="tervezem">Megnézném</button>
           <button class="btn" data-act="addFilm" data-qid="${f.qid}" data-st="lattam">Láttam</button>`}</div></div>`;
    }).join('');
  } catch(e) {
    box.innerHTML = '<div class="muted small" style="padding:8px">Nem sikerült keresni (nincs internet?). Használd a kézi hozzáadást.</div>';
  }
}
function addFilm(qid, status){
  const f = (searchFilms.cache || []).find(x => x.qid === qid);
  if (!f || state.shows.some(sh => sh.qid === qid)) return;
  state.shows.push({id:uid(), kind:'film', qid, tvmazeId:null, name:f.name, image:f.image, meta:f.meta, status,
    lastSeason:0, lastEpisode:0, notes:'', manualNext:null, added:now(), seenAt: status === 'lattam' ? now() : null, cache:{fetchedAt:now()}});
  save(); render();
  toast(status === 'lattam' ? `${f.name} → megnézett filmek` : `${f.name} → Tervezem`);
  doSearch($('#q').value);
}
async function addFromSearch(tid, status){
  const show = (doSearch.cache || []).find(s => s.id === tid);
  if (show) await addShowObj(show, status, () => doSearch($('#q').value));
}
async function addShowObj(show, status, after){
  if (state.shows.some(sh => sh.tvmazeId === show.id)) return;
  const s = slimShow(show);
  const sh = {id:uid(), tvmazeId:show.id, name:show.huName || show.name, customName: !!show.huName, image:s.image, meta:s.meta, status, lastSeason:0, lastEpisode:0, notes:'', manualNext:null, added:now(), cache:null};
  state.shows.push(sh); save();
  toast(`${show.name} → ${TITLES[status]}`);
  if (after) after();
  render();
  try { await fetchShow(sh); save(); render(); } catch(e){}
}

let moreOpen = false;
document.addEventListener('toggle', e => { const t = e.target; if (!t.classList || !t.classList.contains('more')) return; if (t.dataset.g) grpOpen[t.dataset.g] = t.open; else moreOpen = t.open; }, true);
function renderDetail(){
  const sh = byId(sheetState.id); if (!sh) { closeSheet(); return; }
  const sheet = $('#sheet');
  const active = document.activeElement && sheet.contains(document.activeElement) ? document.activeElement.id : null;
  if (active === 'dNotes' || active === 'dLabel') return; // ne írjuk felül gépelés közben
  if (isFilm(sh)) return renderFilmDetail(sh);
  const all = eps(sh);
  const nx = nextInfo(sh);
  const ua = unwatchedAired(sh);
  const meta = sh.meta ? [sh.meta.premiered && sh.meta.premiered.slice(0,4), sh.meta.network, STATUS_HU[sh.meta.status]].filter(Boolean).join(' · ') : 'Kézi sorozat';
  const cur = `${sh.lastSeason}-${sh.lastEpisode}`;
  let progress;
  if (sh.tvmazeId && all.length) {
    const t = now();
    const opts = [`<option value="0-0" ${cur === '0-0' ? 'selected' : ''}>Még nem kezdtem el</option>`];
    let lastS = 0;
    for (const e of all) {
      if (e.s !== lastS) { if (lastS) opts.push('</optgroup>'); opts.push(`<optgroup label="${e.s}. évad">`); lastS = e.s; }
      const v = `${e.s}-${e.n}`;
      const future = e.d && e.d > t ? ` (${fmtDate(e.d)})` : (!e.d ? ' (nincs dátum)' : '');
      opts.push(`<option value="${v}" ${v === cur ? 'selected' : ''}>${code(e.s, e.n)}${e.t ? ' – ' + esc(e.t) : ''}${future}</option>`);
    }
    if (lastS) opts.push('</optgroup>');
    progress = `<select id="dProg">${opts.join('')}</select>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="caughtUp" data-id="${sh.id}" ${ua.length ? '' : 'disabled'}>Mindent láttam, ami kijött</button></div>`;
  } else {
    progress = `<div class="row"><div><label>Évad</label><input type="number" id="dS" min="0" inputmode="numeric" value="${sh.lastSeason}"></div>
      <div><label>Rész</label><input type="number" id="dE" min="0" inputmode="numeric" value="${sh.lastEpisode}"></div></div>`;
  }
  const next = nx ? `<b>${rel(nx.d)}</b> – ${esc(nx.label)}${nx.premiere ? ' <span class="badge">ÚJ ÉVAD</span>' : ''}` :
    (isEnded(sh) ? 'A sorozat véget ért.' : 'Még nincs bejelentett dátum.');
  sheet.innerHTML = `<div class="grab"></div>
    <div class="sheet-head"><h2 style="font-size:17px" class="muted">Részletek</h2><button class="btn" data-act="close">Kész</button></div>
    <div class="detail-top">${coverHtml(sh)}
      <div><div style="font-size:22px;font-weight:800;line-height:1.2">${esc(sh.name)}</div>
      <div class="muted small" style="margin-top:4px">${esc(meta)}</div>
      ${sh.meta && sh.meta.genres && sh.meta.genres.length ? `<div class="muted small">${esc(genresHu(sh.meta.genres).join(', '))}</div>` : ''}
      ${ua.length ? `<div style="color:var(--accent);font-weight:700;margin-top:6px">${ua.length} rész vár rád</div>` : ''}</div></div>
    <div class="field"><label>Lista</label><div class="seg" id="dSeg">
      ${['nezem','tervezem','befejeztem','abbahagytam'].map(v => `<button data-v="${v}" class="${sh.status === v ? 'on' : ''}">${{nezem:'Nézem',tervezem:'Tervezem',befejeztem:'Befejeztem',abbahagytam:'Abbahagytam'}[v]}</button>`).join('')}</div>
      ${sh.status === 'befejeztem' ? '<div class="small muted" style="margin-top:6px">Szólok, ha új évad jön.</div>' : ''}</div>
    <div class="field"><label>Hol tartasz? (az utolsó rész, amit láttál)</label>${progress}</div>
    <div class="field"><label>Következő</label><div>${next}</div></div>
    ${provHtml(sh)}${descHtml(sh)}
    ${starsHtml(sh)}
    <div class="field"><label>Jegyzet</label><textarea id="dNotes" placeholder="pl. HBO Max-on van">${esc(sh.notes)}</textarea></div>
    <details class="more" ${moreOpen ? 'open' : ''}><summary>További beállítások</summary>
    ${sh.tvmazeId ? `<div class="field"><label>Streamingen előrébb jár? (pl. RTL+ Premium, TV2 Play Prémium)</label>
      <select id="dAhead">${[0,1,2,3].map(n => `<option value="${n}" ${(sh.ahead || 0) === n ? 'selected' : ''}>${n ? n + ' résszel előrébb jár, mint a tévé' : 'Nem, a tévével együtt megy'}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label>Saját adásrend (ha a dátum hiányzik vagy hibás, pl. szombat 20:00)</label>
      <div class="wk" id="dWk">${WD_HU.map(([l, d]) => `<button data-d="${d}" class="${sh.sched && sh.sched.days.includes(d) ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="time" id="dTime" value="${esc((sh.sched && sh.sched.time) || '20:00')}" style="margin-top:8px">
      ${sh.tvmazeId ? `<label class="chk"><input type="checkbox" id="dForce" ${sh.sched && sh.sched.force ? 'checked' : ''}> Mindig ezt használd az adatbázis dátumai helyett</label>` : ''}</div>
    <div class="field"><label>Saját emlékeztető dátum (pl. ha olvastál az új évadról)</label>
      <input type="date" id="dDate" value="${sh.manualNext ? esc(sh.manualNext.date) : ''}">
      <input type="text" id="dLabel" placeholder="pl. 3. évad premier" value="${sh.manualNext ? esc(sh.manualNext.label) : ''}" style="margin-top:8px"></div>
    ${sh.tvmazeId ? `<button class="btn block" data-act="refreshOne" data-id="${sh.id}">Adatok frissítése</button>` : ''}

    <button class="btn block danger" data-act="delete" data-id="${sh.id}">Törlés</button></details>
    ${sh.tvmazeId ? '' : `<div class="field"><label>Automatikus részek és dátumok</label>
        <div class="small muted">Ezt a sorozatot kézzel vetted fel, ezért nem kap automatikusan új részeket. Keresd meg az adatbázisban – ahol tartasz, az megmarad.</div>
        <button class="btn block" data-act="linkSearch" data-id="${sh.id}">Keresés az adatbázisban</button><div id="linkRes" style="margin-top:10px"></div></div>`}`;

  $('#dSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sh.status = b.dataset.v; save(); render(); });
  const saveSched = () => {
    const days = [...document.querySelectorAll('#dWk button.on')].map(b => +b.dataset.d);
    sh.sched = days.length ? {days, time: $('#dTime').value || '20:00', force: !!($('#dForce') && $('#dForce').checked)} : null;
    save(); render();
  };
  $('#dWk').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; b.classList.toggle('on'); saveSched(); });
  $('#dTime').addEventListener('change', saveSched);
  if ($('#dForce')) $('#dForce').addEventListener('change', saveSched);
  const ah = $('#dAhead'); if (ah) ah.addEventListener('change', () => { sh.ahead = parseInt(ah.value) || 0; save(); render(); });
  const prog = $('#dProg');
  if (prog) prog.addEventListener('change', () => { const [s, n] = prog.value.split('-').map(Number); setProgress(sh, s, n); save(); render(); });
  ['dS','dE'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('change', () => {
    setProgress(sh, Math.max(0, parseInt($('#dS').value) || 0), Math.max(0, parseInt($('#dE').value) || 0)); save(); render(); }); });
  const saveManualNext = () => { const d = $('#dDate').value; sh.manualNext = d ? {date:d, label:$('#dLabel').value.trim()} : null; save(); };
  $('#dDate').addEventListener('change', () => { saveManualNext(); render(); });
  $('#dLabel').addEventListener('input', saveManualNext);
  $('#dLabel').addEventListener('blur', render);
  $('#dNotes').addEventListener('input', () => { sh.notes = $('#dNotes').value; save(); });
  $('#dNotes').addEventListener('blur', render);
}

  const dates = [];
  if (m.release) dates.push(`Első bemutató: <b>${esc(fmtFilmDate({d: m.release, prec: m.prec || 11}))}</b>`);
  if (m.huRelease) dates.push(`Magyar premier: <b>${esc(fmtDate(m.huRelease))}</b>`);
  const nx = nextInfo(sh);
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="sheet-head"><h2 style="font-size:17px" class="muted">Film</h2><button class="btn" data-act="close">Kész</button></div>
    <div class="detail-top">${coverHtml(sh)}
      <div><div style="font-size:22px;font-weight:800;line-height:1.2">${esc(sh.name)}</div>
      ${m.orig && m.orig !== sh.name ? `<div class="muted small" style="margin-top:4px">${esc(m.orig)}</div>` : ''}
      ${m.genres && m.genres.length ? `<div class="muted small" style="margin-top:4px">${esc(genresHu(m.genres).join(', '))}</div>` : ''}
      ${m.desc ? `<div class="muted small" style="margin-top:4px">${esc(m.desc)}</div>` : ''}
      ${nx ? `<div style="color:var(--accent);font-weight:700;margin-top:6px">${esc(nx.label)}: ${rel(nx.d)}</div>` :
        (fd && fd.d > now() ? `<div style="color:var(--accent);font-weight:700;margin-top:6px">Várható: ${esc(fmtFilmDate(fd))}</div>` : '')}</div></div>
    <div class="field"><label>Lista</label><div class="seg" id="dSeg">
      ${[['tervezem','Megnézném'],['lattam','Láttam'],['abbahagytam','Nem érdekel']].map(([v, l]) => `<button data-v="${v}" class="${sh.status === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${dates.length ? `<div class="field"><label>Megjelenés</label>${dates.map(d => `<div>${d}</div>`).join('')}</div>` : ''}

/* ---------- TMDB: hol nézhető Magyarországon (JustWatch adatai) + magyar leírás ---------- */
const TMDB = 'https://api.themoviedb.org/3';
// csak olvasási TMDB API-kulcs (a Beállításokban felülírható)
const TMDB_DEFAULT = '3a59373cb0306b9701118f8cfc3b6644';
const tmdbKey = () => lsGet('nezonaplo.tmdb') || TMDB_DEFAULT;
async function tmdbGet(path, params){
  const k = tmdbKey(), jwt = k.startsWith('eyJ');
  const q = new URLSearchParams(Object.assign({}, params || {}, jwt ? {} : {api_key: k}));
  const r = await fetch(`${TMDB}${path}?${q}`, jwt ? {headers: {Authorization: 'Bearer ' + k}} : {});
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function tmdbResolve(sh){
  if (sh.tmdb) return sh.tmdb;
  if (isFilm(sh)) {
    const m = sh.meta || {};
    if (m.tmdbId) return sh.tmdb = {type: 'movie', id: +m.tmdbId};
    if (m.imdb) { const j = await tmdbGet(`/find/${m.imdb}`, {external_source: 'imdb_id'}); const r = (j.movie_results || [])[0]; if (r) return sh.tmdb = {type: 'movie', id: r.id}; }
    return null;
  }
  if (!sh.tvmazeId) return null;
  if (!sh.ext) { const j = await (await fetch(`${API}/shows/${sh.tvmazeId}`)).json(); sh.ext = {imdb: (j.externals || {}).imdb || null, tvdb: (j.externals || {}).thetvdb || null}; }
  for (const [src, v] of [['imdb_id', sh.ext.imdb], ['tvdb_id', sh.ext.tvdb]]) {
    if (!v) continue;
    const j = await tmdbGet(`/find/${v}`, {external_source: src}); const r = (j.tv_results || [])[0];
    if (r) return sh.tmdb = {type: 'tv', id: r.id};
  }
  return null;
}
const provList = a => (a || []).map(p => ({n: p.provider_name, l: p.logo_path}));
async function tmdbLoad(sh, force){
  if (!tmdbKey() || (!force && sh.tmdbInfo && now() - sh.tmdbInfo.at < 3 * DAY)) return false;
  sh.loading = true;
  try {
    const t = await tmdbResolve(sh);
    if (!t) { sh.tmdbInfo = {at: now(), none: true}; save(); return true; }
    const [det, prov] = await Promise.all([tmdbGet(`/${t.type}/${t.id}`, {language: 'hu-HU'}), tmdbGet(`/${t.type}/${t.id}/watch/providers`)]);
    const hu = (prov.results || {}).HU || {};
    const G = {28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Science-Fiction',53:'Thriller',10752:'War',37:'Western'};
    if (isFilm(sh) && sh.id && det.genres) sh.meta = Object.assign({}, sh.meta, {genres: det.genres.map(g => G[g.id]).filter(Boolean)});
    sh.tmdbInfo = {at: now(), overview: det.overview || '', link: hu.link || '',
      flat: provList(hu.flatrate), free: provList([...(hu.free || []), ...(hu.ads || [])]), rent: provList(hu.rent), buy: provList(hu.buy)};
    // magyar sorozatcím, ha van fordítás (és nem írtad át)
    const huName = det.name || det.title, orig = det.original_name || det.original_title;
    if (!isFilm(sh) && !sh.customName && sh.id && huName && huName !== orig && huName !== sh.name) { sh.name = huName; sh.customName = true; }
    save(); return true;
  } catch(e) { if (e.status === 401) toast('Hibás TMDB-kulcs'); return false; }
  finally { delete sh.loading; }
}

function genreProfile(){
  const w = {};
  for (const sh of state.shows) {

const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

// kicsinyítés 2:3-as képre, hogy kevés helyet foglaljon a telefonon
function resizeCover(file){
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 240, H = 360, r = Math.max(W / img.width, H / img.height);
      const w = img.width * r, h = img.height * r;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('nem olvasható kép')); };
    img.src = url;
  });
}
let coverFor = null;
async function setCover(file){
  const sh = byId(coverFor); coverFor = null; if (!sh || !file) return;
  try { sh.image = await resizeCover(file); sh.customImage = true; save(); render(); if (sheetState) renderDetail(); toast('Borító beállítva'); }

  }
  save(); render();
}
function caughtUp(sh){
  const ua = unwatchedAired(sh); if (!ua.length) return;
  const last = ua[ua.length - 1]; setProgress(sh, last.s, last.n); save(); render(); toast('Naprakész vagy 👍');
}
async function shareOrDownload(filename, mime, text){
  const file = new File([text], filename, {type:mime});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return true; } catch(e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
function backupObj(){
  return {app:'sorozatmemoria', version:1, exported:new Date().toISOString(), shows:state.shows.map(sh => Object.assign({}, sh, {cache:null})),
    stats:state.stats || null, statsSince:state.statsSince || null,
    youtube:{seen:yt.seen, nope:yt.nope, hidden:yt.hidden, later:yt.later, pl:yt.pl || null, plDel:yt.plDel || [], shortsHide:yt.shortsHide},
    prefs:{discHidden}};
}
// iCloud: a megosztás menüben "Mentés a Fájlokba" → iCloud Drive. Mindig ugyanaz a fájlnév, így az iPhone felajánlja a cserét.
async function exportData(){
  const ok = await shareOrDownload('Nezonaplo-mentes.json', 'application/json', JSON.stringify(backupObj(), null, 1));
  if (ok) { lsSet('nezonaplo.exportAt', String(now())); render(); }
}
const backupDue = () => state.shows.length > 0 && now() - (+lsGet('nezonaplo.exportAt') || +lsGet('nezonaplo.driveAt') || state.statsSince || 0) > 7 * DAY
  && now() - (+lsGet('nezonaplo.driveAt') || 0) > 7 * DAY && now() - (+lsGet('nezonaplo.remindLater') || 0) > DAY;
function applyBackup(j){
  if (!j || !Array.isArray(j.shows)) throw new Error('nem jó fájl');
  state = {shows:j.shows.map(sh => Object.assign({lastSeason:0, lastEpisode:0, notes:'', manualNext:null, cache:null}, sh, {id: sh.id || uid()})), lastRefresh:0,
    stats:j.stats || undefined, statsSince:j.statsSince || undefined};
  if (j.youtube) { Object.assign(yt, {seen:j.youtube.seen || {}, nope:j.youtube.nope || {}, hidden:j.youtube.hidden || {},
    later:j.youtube.later || {}, pl:j.youtube.pl || null, plDel:j.youtube.plDel || [], shortsHide:j.youtube.shortsHide}); ytSave(); }
  if (j.prefs && j.prefs.discHidden) { discHidden = j.prefs.discHidden; saveDiscHidden(); }
  save(); render(); toast('Visszatöltve'); refreshAll(true);
}

/* ---------- automatikus mentés Google Drive-ra ---------- */
const DRIVE_NAME = 'Nezonaplo-mentes.json';
const strHash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + s.length; };
let driveBusy = false;
async function driveFetch(url, opts, keepalive){
  const r = await fetch(url, Object.assign({}, opts, {keepalive: !!keepalive, headers: Object.assign({Authorization: 'Bearer ' + ytToken()}, (opts || {}).headers || {})}));
  if (r.status === 401) { lsSet('nezonaplo.ytTok', ''); throw new Error('auth'); }
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; e.text = await r.text().catch(() => ''); throw e; }
  return r.status === 204 ? null : r.json();
}
async function driveFind(){
  const q = encodeURIComponent(`name='${DRIVE_NAME}' and trashed=false`);
  const j = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&spaces=drive`);
  return (j.files || [])[0] || null;
}
function driveErr(e){
  if (e.status === 403 && /accessNotConfigured|has not been used|disabled/i.test(e.text || '')) return 'A Google Drive API nincs bekapcsolva a Google Cloud projektben';
  return 'Drive-mentés nem sikerült (' + e.message + ')';
}
async function driveBackup(byUser){
  if (driveBusy) return;
  if (!ytToken() || !driveOk()) { if (byUser) { lsSet('nezonaplo.driveOn', '1'); ytLogin(!!ytToken() || !!yt.fetchedAt); } return; }
  const body = JSON.stringify(backupObj()), h = strHash(body.replace(/"exported":"[^"]*"/, ''));
  if (!byUser && (h === lsGet('nezonaplo.driveHash') || now() - (+lsGet('nezonaplo.driveAt') || 0) < 2 * 60e3)) return;
  driveBusy = true;
  try {
    let id = lsGet('nezonaplo.driveId');
    if (!id) { const f = await driveFind(); id = f ? f.id : ''; }
    const small = body.length < 60000; // iOS: háttérbe kerüléskor csak kis kérés megy át biztosan
    try {
      if (!id) throw Object.assign(new Error('new'), {status: 404});
      await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body}, small);
    } catch(e) {
      if (e.status !== 404) throw e;
      const b = 'nezonaplo' + uid();
      const multi = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name: DRIVE_NAME, mimeType: 'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const j = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + b}, body: multi});
      id = j.id;
    }
    lsSet('nezonaplo.driveId', id); lsSet('nezonaplo.driveHash', h); lsSet('nezonaplo.driveAt', String(now()));
    if (byUser) toast('Elmentve a Google Drive-ra');
  } catch(e) {
    if (e.message === 'auth') { if (byUser) ytLogin(true); }
    else if (byUser) toast(driveErr(e));
  }
  driveBusy = false; if (tab === 'beall') render();
}
async function driveRestore(){
  if (!ytToken() || !driveOk()) { lsSet('nezonaplo.driveOn', '1'); ytLogin(false); return; }
  try {
    const f = await driveFind(); if (!f) { toast('Nincs mentés a Drive-on'); return; }
    const j = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
    if (!confirm(`Visszatöltöd a ${fmtDate(Date.parse(f.modifiedTime), {hour: '2-digit', minute: '2-digit'})}-i Drive-mentést? Ez lecseréli a mostani listát.`)) return;
    lsSet('nezonaplo.driveId', f.id); applyBackup(j);
  } catch(e) { if (e.message === 'auth') ytLogin(true); else toast(driveErr(e)); }
}
const driveAuto = () => lsGet('nezonaplo.driveOn') === '1' && driveOk() && ytToken() && driveBackup(false);
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || !Array.isArray(j.shows)) throw new Error('nem jó fájl');
      if (!confirm(`${j.shows.length} sorozat/film betöltése? Ez lecseréli a mostani listát.`)) return;
      applyBackup(j);
    } catch(e) { toast('Hibás fájl: ' + e.message); }
  };
  r.readAsText(file);
}
function icsFor(key){
  const it = upcomingItems().items.find(x => x.key === key); if (!it) return;
  const d = new Date(it.d);
  const ymd = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`;
  const end = new Date(d); end.setDate(end.getDate() + 1);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const txt = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const title = `${it.premiere ? '🔥 Új évad: ' : it.film ? '🎞️ ' : '📺 '}${it.sh.name} – ${it.label}`;
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sorozatmemoria//HU','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${it.key}@sorozatmemoria`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(d)}`, `DTEND;VALUE=DATE:${ymd(end)}`,
    `SUMMARY:${txt(title)}`, `DESCRIPTION:${txt('Nézőnapló emlékeztető' + (it.sh.meta && it.sh.meta.network ? ' – ' + it.sh.meta.network : ''))}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${txt(title)}`,'TRIGGER:PT10H','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  shareOrDownload(`${it.sh.name.replace(/[^\p{L}\p{N}]+/gu,'-')}-${ymd(d)}.ics`, 'text/calendar', ics);
}

/* ---------- húzásos gesztusok ---------- */
let swipedAt = 0;
(() => {
  let el = null, x0 = 0, y0 = 0, dx = 0, mode = '';
  const TH = 90;
  const reset = () => { if (!el) return; el.style.transition = 'transform .2s'; el.style.transform = ''; el.classList.remove('sw-l', 'sw-r', 'sw-go');
    const e = el; setTimeout(() => { e.style.transition = ''; }, 220); el = null; mode = ''; };
  document.addEventListener('touchstart', e => {
    const t = e.target.closest('[data-swipe-l],[data-swipe-r]'); if (!t || e.touches.length > 1) return;
    el = t; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = '';
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (!el) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!mode) { if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { el = null; return; } if (Math.abs(mx) > 12) mode = 'h'; else return; }
    e.preventDefault();
    dx = mx;
    if ((dx < 0 && !el.dataset.swipeL) || (dx > 0 && !el.dataset.swipeR)) dx = dx / 6; // arra nincs művelet: csak kicsit enged
    el.style.transform = `translateX(${dx}px)`;
    el.classList.toggle('sw-l', dx < 0 && !!el.dataset.swipeL); el.classList.toggle('sw-r', dx > 0 && !!el.dataset.swipeR);
    el.classList.toggle('sw-go', Math.abs(dx) > TH);
  }, {passive: false});
  const end = () => {
    if (!el) return;
    if (mode === 'h') {
      swipedAt = now();
      const act = dx < -TH ? el.dataset.swipeL : dx > TH ? el.dataset.swipeR : '';
      const src = el; reset();
      if (act) { // ugyanazon az úton fut, mint a gombok
        const b = document.createElement('button'); b.hidden = true; b.dataset.act = act;
        if (src.dataset.id) b.dataset.id = src.dataset.id; if (src.dataset.vid) b.dataset.vid = src.dataset.vid;
        document.body.appendChild(b); swipedAt = 0; b.click(); b.remove(); swipedAt = now();
      }
    } else el = null;
  };
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', () => { if (el) reset(); });
})();

/* ---------- események ---------- */
document.addEventListener('click', e => {
  if (now() - swipedAt < 400) return; // húzás után ne nyíljon meg az adatlap
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { tab = el.dataset.tab; lsSet('sorozatmemoria.tab', tab); render(); window.scrollTo(0,0);
    if (tab === 'youtube' && yt.fetchedAt && now() - yt.fetchedAt > 30 * 60e3) {
      if (ytToken()) ytRefresh(false);
      else if (now() - (+lsGet('nezonaplo.ytAuto') || 0) > 10 * 60e3 && navigator.onLine) { lsSet('nezonaplo.ytAuto', String(now())); ytLogin(true); }
    }
    return; }
  const id = el.dataset.id, sh = id && byId(id);
  switch (el.dataset.act) {
    case 'open': openSheet({type:'detail', id}); break;
    case 'plus': e.stopPropagation(); plusOne(sh); break;
    case 'start': e.stopPropagation(); sh.status = 'nezem'; save(); render(); toast(`${sh.name} → Nézem`); break;
    case 'close': closeSheet(); break;
    case 'manual': openSheet({type:'manual'}); break;
    case 'saveManual': saveManual(); break;
    case 'add': addFromSearch(Number(el.dataset.tid), el.dataset.st); break;
    case 'addFilm': addFilm(el.dataset.qid, el.dataset.st); break;
    case 'seen': e.stopPropagation(); sh.status = 'lattam'; sh.seenAt = now(); save(); render(); toast(`${sh.name} → megnézett filmek`); sequelCheck(sh); break;
    case 'finish': e.stopPropagation(); sh.status = 'befejeztem'; save(); render(); toast(`${sh.name} befejezve – szólok, ha új évad jön`); break;
    case 'askYes': askAnswer(sh, el.dataset.k, true); break;
    case 'askNo': askAnswer(sh, el.dataset.k, false); break;
    case 'tervFilter': tervFilter = el.dataset.v; render(); break;
    case 'caughtUp': caughtUp(sh); break;
    case 'refreshOne': (async () => { try { await (sh.qid ? fetchFilm(sh) : fetchShow(sh)); save(); render(); toast('Frissítve'); } catch(err) { toast('Nem sikerült frissíteni'); } })(); break;
    case 'delete': if (confirm(`Törlöd: ${sh.name}?`)) { state.shows = state.shows.filter(x => x !== sh); save(); closeSheet(); render(); } break;
    case 'cover': coverFor = id; $('#coverFile').click(); break;
    case 'coverReset': sh.customImage = false; sh.image = null; save(); render(); renderDetail(); toast('Saját borító törölve');
      if (sh.tvmazeId || sh.qid) (sh.qid ? fetchFilm(sh) : fetchShow(sh)).then(() => { save(); render(); if (sheetState) renderDetail(); }).catch(() => {}); break;
    case 'linkSearch': linkSearch(sh); break;
    case 'link': linkShow(sh, Number(el.dataset.tid)); break;
    case 'ytSaveClient': { const v = ($('#ytClientIn').value || '').trim();
      if (!/\.apps\.googleusercontent\.com$/.test(v)) { toast('Ez nem tűnik Client ID-nak'); break; }
      lsSet('nezonaplo.ytClient', v); render(); break; }
    case 'ytClientReset': lsSet('nezonaplo.ytClient', ''); render(); break;
    case 'ytLogin': ytLogin(false); break;
    case 'ytOpen': yt.seen[el.dataset.vid] = 1; if (yt.later[el.dataset.vid]) yt.later[el.dataset.vid].watched = 1; ytSave(); setTimeout(() => { render(); if (sheetState && sheetState.type === 'yt') renderYtDetail(); }, 400); break; // a link megnyílik (YouTube app)
    case 'ytDetail': openSheet({type:'yt', vid: el.dataset.vid}); break;
    case 'ytNope': { const id = el.dataset.vid; if (yt.nope[id]) delete yt.nope[id]; else { yt.nope[id] = 1; toast('Elrejtve'); }
      ytSave(); render(); if (sheetState && sheetState.type === 'yt') closeSheet(); break; }
    case 'ytWant': { const v = ytFind(el.dataset.vid); if (!v) break; yt.seen[v.id] = 1; ytAddLater(v); break; }
    case 'plLoad': if (!ytToken()) { ytLogin(true); break; } plLoadChoices(); break;
    case 'plChoose': plChoose(el.dataset.id, el.dataset.title); break;
    case 'plCancel': plChoices = null; render(); break;
    case 'ytShowNope': showNope = !showNope; render(); break;
    case 'ytSeenToggle': { const id = el.dataset.vid, lt = yt.later[id];
      const was = lt ? !!lt.watched : !!yt.seen[id];
      if (was) { delete yt.seen[id]; if (lt) delete lt.watched; } else { yt.seen[id] = 1; if (lt) lt.watched = 1; } ytSave(); render(); if (sheetState && sheetState.type === 'yt') renderYtDetail(); break; }
    case 'ytLater': { const id = el.dataset.vid, v = ytFind(id);
      (yt.later[id] ? ytRemoveLater(id) : v ? ytAddLater(v) : Promise.resolve()).then(() => { if (sheetState && sheetState.type === 'yt') renderYtDetail(); });
      if (sheetState && sheetState.type === 'yt') renderYtDetail(); break; }
    case 'ytAllSeen': ytVisible().filter(v => !ytChan || v.ch === ytChan).forEach(v => { yt.seen[v.id] = 1; }); ytSave(); render(); break;
    case 'ytHide': { const c = el.dataset.ch; if (yt.hidden[c]) delete yt.hidden[c]; else yt.hidden[c] = 1; ytSave(); render();
      if (!yt.hidden[c] && ytToken()) ytRefresh(false); break; }
    case 'ytLogout': if (confirm('Leválasztod a YouTube-ot? A letöltött lista törlődik.')) {
      const tok = ytToken(); if (tok) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(tok), {method: 'POST'}).catch(() => {});
      lsSet('nezonaplo.ytTok', ''); yt = {channels:[], videos:[], seen:{}, hidden:{}, later:{}, nope:{}, fetchedAt:0}; ytSave(); render(); } break;
    case 'kozView': kozView = el.dataset.v; lsSet('nezonaplo.kozView', kozView); render(); window.scrollTo(0,0); break;
    case 'discKind': discKind = el.dataset.v; lsSet('nezonaplo.discKind', discKind); render(); window.scrollTo(0,0); break;
    case 'discAdd': e.stopPropagation(); discAdd(el).then(() => { if (sheetState && sheetState.type === 'disc') renderDiscDetail(); }); if (sheetState && sheetState.type === 'disc') setTimeout(renderDiscDetail, 50); break;
    case 'statsOpen': openSheet({type: 'stats'}); break;
    case 'discOpen': openSheet({type: 'disc', key: el.dataset.key}); break;
    case 'discHide': discHidden[el.dataset.key] = 1; saveDiscHidden(); render(); toast('Elrejtve'); if (sheetState && sheetState.type === 'disc') closeSheet(); break;
    case 'discUnhide': delete discHidden[el.dataset.key]; saveDiscHidden(); render(); if (sheetState && sheetState.type === 'disc') renderDiscDetail(); break;
    case 'discShowHidden': showHiddenDisc = !showHiddenDisc; render(); break;
    case 'rate': { const v = +el.dataset.v; sh.rating = sh.rating === v ? 0 : v; save(); render(); break; }
    case 'ics': e.stopPropagation(); icsFor(el.dataset.key); break;
    case 'refresh': refreshAll(true); break;
    case 'export': exportData(); break;
    case 'remindLater': lsSet('nezonaplo.remindLater', String(now())); render(); break;
    case 'driveSave': driveBackup(true); break;
    case 'driveRestore': driveRestore(); break;
    case 'driveOff': lsSet('nezonaplo.driveOn', ''); render(); break;
    case 'tmdbSave': { const v = ($('#tmdbIn').value || '').trim(); if (v.length < 20) { toast('Ez nem tűnik TMDB-kulcsnak'); break; }
      lsSet('nezonaplo.tmdb', v); render(); toast('TMDB-kulcs elmentve'); tmdbFill(); break; }
    case 'tmdbReset': lsSet('nezonaplo.tmdb', ''); render(); break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': if (confirm('Biztosan törölsz minden sorozatot? Ezt nem lehet visszavonni.')) { state = {shows:[], lastRefresh:0}; save(); render(); } break;
  }
});
$('#addBtn').addEventListener('click', () => openSheet({type:'search'}));
$('#refreshBtn').addEventListener('click', () => tab === 'youtube' ? ytRefresh(true) : refreshAll(true));
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
$('#coverFile').addEventListener('change', e => { setCover(e.target.files[0]); e.target.value = ''; });
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); refreshAll(false); } else driveAuto(); });
window.addEventListener('online', () => refreshAll(false));

const ytBack = ytHandleRedirect();
render();
refreshAll(false).then(tmdbFill).then(() => sequelCheck());
if (ytBack && tab === 'beall') driveBackup(true);
else if (ytBack) ytRefresh(true);
else if (tab === 'youtube' && ytToken() && now() - yt.fetchedAt > 30 * 60e3) ytRefresh(false);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
