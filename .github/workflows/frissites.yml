# Naponta frissíti a közelgő premiereket (upcoming.json),
# hetente egyszer a magyar műsorok listáját (hu-shows.json).
name: Adatok frissítése
on:
  schedule:
    - cron: '17 3 * * *'   # minden nap 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Közelgő premierek
        run: python3 scripts/upcoming.py
      - name: Magyar műsorok (hétfőnként, vagy kézi indításkor)
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then python3 scripts/hu_shows.py; fi
      - name: Mentés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming.json hu-shows.json
          git diff --cached --quiet || (git commit -m "Adatok frissítése" && git push)
